name: CI

# Lint, test, scan, and gate the agents on their evals.
#
# Three principles shape this file.
#
# Actions are pinned to a commit, not a tag. A tag is mutable: whoever controls
# an action's repository can move v4 to new code, which then runs with this
# workflow's token and can read anything the job can. The comment after each SHA
# records the human-readable version so Dependabot can bump both together.
#
# Permissions are declared per job, not once at the top. Every job starts from
# contents: read and asks for more only where it genuinely needs it, so a
# compromised step in one job cannot write to the repository from another.
#
# The security jobs fail the build. A secret-scanning or infrastructure finding
# is not advisory: it blocks the merge. Container CVEs are the exception and are
# reported rather than blocking, because a base-image CVE with no available fix
# would otherwise stop all work until upstream moves.

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # --- Secrets ---------------------------------------------------------------
  # First, and blocking. The repository will hold a client's infrastructure
  # configuration; a key committed by accident has to be caught before it is
  # merged, not after it is in the history.
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # gitleaks needs history to scan commits, not just the tree.
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@83373cf2f8c4db6e24b41c1a9b086bb9619e9cd3 # v2.3.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A GitHub expression has single-quoted strings only. A double quote in
      # one is a parse error, and a workflow that does not parse produces a run
      # with no jobs: GitHub reports it as a failed CI run, the red X looks
      # like a failing test, and nothing has actually run. That state held here
      # for three weeks before anyone looked past the colour.
      #
      # This check cannot save a workflow that is already broken, because a
      # broken workflow does not run it. It catches the edit that would break
      # it, on a branch whose workflow still parses. The durable signal is the
      # job count: a CI run with zero jobs never started, whatever it says.
      - name: Workflow expressions parse
        run: |
          python3 - <<'EOF'
          import re, sys, pathlib
          bad = []
          for f in sorted(pathlib.Path(".github/workflows").glob("*.yml")):
              text = f.read_text()
              for m in re.finditer(r"\$\{\{(.*?)\}\}", text, re.S):
                  if '"' in m.group(1):
                      line = text[: m.start()].count("\n") + 1
                      bad.append(f"{f}:{line}: {m.group(0).strip()}")
          if bad:
              print("\n".join(bad))
              print("::error::a workflow expression uses double quotes; GitHub expressions take single quotes only, and the whole file fails to parse")
              sys.exit(1)
          print("workflow expressions parse")
          EOF

  # --- Python service --------------------------------------------------------
  python:
    name: Python lint, tests, audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install service (with dev extras)
        run: pip install -e "./model[dev]"

      - name: Lint (ruff)
        working-directory: model
        run: python -m ruff check welo_inference tests build_outcome_series.py

      - name: Tests (unit + integration)
        working-directory: model
        run: python -m pytest

      # The monthly cohort series is committed, because the Next build reads it
      # and CI must not need a model run to build the application. A committed
      # generated file goes stale in silence, so this rebuilds it and fails if
      # the result differs: an outcome report computed from a stale series is
      # the kind of wrong that looks right.
      - name: The committed cohort series matches its builder
        working-directory: model
        run: |
          cp data/outputs/cohort_series.json /tmp/series-committed.json
          python build_outcome_series.py > /dev/null
          if ! diff -q /tmp/series-committed.json data/outputs/cohort_series.json; then
            echo "::error::model/data/outputs/cohort_series.json is stale. Run python model/build_outcome_series.py and commit the result."
            diff /tmp/series-committed.json data/outputs/cohort_series.json | head -20
            exit 1
          fi
          echo "cohort series is in sync with build_outcome_series.py"

      # The runtime lock is what the container installs. It is audited rather
      # than the dev environment, because the lock is what reaches a client.
      - name: Audit runtime dependencies (pip-audit)
        working-directory: model
        run: |
          pip install pip-audit
          pip-audit --requirement requirements-runtime.txt --strict

      # A lock that no longer matches its input is a lock nobody is maintaining.
      - name: Runtime lock is in sync with its input
        working-directory: model
        run: |
          pip install pip-tools
          cp requirements-runtime.txt /tmp/lock.before
          pip-compile --quiet --generate-hashes --output-file=requirements-runtime.txt requirements-runtime.in
          if ! diff -q /tmp/lock.before requirements-runtime.txt; then
            echo "::error::requirements-runtime.txt is out of date. Run pip-compile --generate-hashes requirements-runtime.in and commit the result."
            diff /tmp/lock.before requirements-runtime.txt || true
            exit 1
          fi

  # --- The platform application ---------------------------------------------
  # The Next.js app was not built in CI before, so a broken screen only showed
  # up on Vercel. It builds here now, against the production build rather than
  # dev, because dev mode masks failures the real server does not.
  web:
    name: Platform build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "22"
          cache: npm

      - name: Install (from the lockfile, no resolution)
        run: npm ci

      # Money has one formatter. Every amount is stored in Rand and converted
      # for display, so a screen that builds its own "R" + number renders a
      # figure the currency toggle cannot reach: it would read R while every
      # other figure on the page read $, and nothing would fail.
      #
      # modules/sick-leave/agentFallback.js is the one exception and is listed
      # by name. It composes an agent answer, and the agents reason in the
      # stored unit on purpose rather than being handed a rate to multiply by;
      # the panel says so beside the answer.
      - name: Money goes through one formatter
        run: |
          hits=$(grep -rnE "['\"]R['\"] *\+" --include='*.js' --include='*.jsx' \
                   app components modules lib \
                 | grep -v '^modules/sick-leave/agentFallback.js:' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::a currency symbol is hardcoded outside lib/platform/currency.js"
            exit 1
          fi
          # And the formatter itself must not use toLocaleString: its separator
          # depends on the runtime's ICU data, which differs between Node and
          # the browser, and this module renders on both.
          # Matched as a call, not a mention: the comment in that file explains
          # why it is not used, and a check that flags its own rationale is a
          # check somebody adds an exemption to rather than reads.
          if grep -nE '\.toLocaleString *\(' lib/platform/currency.js | grep -vE '^[0-9]+: *(//|\*)'; then
            echo "::error::lib/platform/currency.js uses toLocaleString, which is not hydration safe"
            exit 1
          fi

      # The module data is generated and gitignored: modules/absence/data/
      # portfolio.js and modules/control-centre/data/series.js are built from
      # the model feed by the prebuild scripts. The tests that read them run
      # before "Build", so without this step they import a file that does not
      # exist in a fresh checkout and the job fails on a missing module rather
      # than on anything about the code.
      #
      # This is why the unit tests failed in CI while passing locally: a
      # developer's working tree has these files from an earlier build, and a
      # clean checkout does not. It went unnoticed because the workflow itself
      # had not parsed since 2026-10-03, so nothing ran to report it.
      - name: Generate the module data the tests read
        run: npm run prebuild

      # The glob used to be modules/**/*.test.mjs, which without globstar
      # expands one level and silently skipped every test under lib/, including
      # the RBAC matrix. Name both roots and assert the count, so a test file
      # that stops being collected fails here instead of passing quietly.
      - name: Unit tests
        run: |
          mapfile -t FILES < <(find lib modules -name '*.test.mjs' | sort)
          echo "collected ${#FILES[@]} test files:"
          printf '  %s\n' "${FILES[@]}"
          if [ "${#FILES[@]}" -lt 14 ]; then
            echo "expected at least 14 test files, found ${#FILES[@]}" >&2
            exit 1
          fi
          node --test "${FILES[@]}"

      - name: Build
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=high

      # The screens are server-rendered; a 500 or a blank render is only visible
      # if something asks for them. This is the check that caught a disabled
      # module returning 200 with a 404 page.
      - name: Smoke the built server
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public

          # Wait for a server and fail loudly if it never answers. Without this
          # a server that did not start shows up as a wrong status code on an
          # unrelated assertion, and the error points at the wrong thing.
          wait_up() {
            for i in $(seq 1 40); do
              curl -sf -o /dev/null "http://127.0.0.1:$1/signin" && return 0
              sleep 1
            done
            echo "::error::no server answered on port $1 after 40s"
            return 1
          }

          # Explicitly off. The control centre now defaults on for a synthetic
          # tenant, so these assertions used to pass on a default rather than on
          # a setting. The variable name was always SRV_DISABLED; now it is
          # actually disabled because this says so.
          WELO_MODULE_CONTROL_CENTRE=0 PORT=3000 node .next/standalone/server.js &
          SRV_DISABLED=$!
          wait_up 3000 || exit 1
          fail=0

          # Every shell route needs a session now. Unauthenticated is a
          # redirect to the account picker, which is itself worth asserting:
          # if this ever returns 200, the application is open.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/absence)
          echo "/absence with no session -> $code"
          [ "$code" = "307" ] || { echo "::error::an unauthenticated route returned $code, expected a redirect"; fail=1; }

          # Sign in as the analyst, who holds the widest read access, so the
          # render checks below cover every screen.
          curl -s -c /tmp/jar -X POST -H 'content-type: application/json' \
            -d '{"email":"sipho.dlamini@example.com"}' http://127.0.0.1:3000/api/session > /dev/null
          # /admin is not in this list: the analyst signed in above cannot reach
          # it, and it is covered under client_admin in the RBAC matrix below.
          for path in / /absence /absence/cohorts /absence/outcomes /absence/operations \
                      /sick-leave /sick-leave/case /sick-leave/ops; do
            code=$(curl -s -b /tmp/jar -o /tmp/page.html -w '%{http_code}' "http://127.0.0.1:3000$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || { echo "::error::$path returned $code"; fail=1; }
            # A rendered NaN or undefined means a figure did not resolve.
            if grep -qE '>(NaN|undefined)<' /tmp/page.html; then
              echo "::error::$path rendered NaN or undefined"
              fail=1
            fi
            # Every shell screen carries the display-currency control, because
            # it applies to every figure on every screen and lives in the shell
            # header rather than per screen.
            if ! grep -q 'ccy-btn' /tmp/page.html; then
              echo "::error::$path rendered without the currency control"
              fail=1
            fi
          done

          # The server renders the stored unit. The chosen currency lives in
          # browser storage, which the server cannot see, so a server render
          # that was anything but Rand would mean a leaf read a choice the
          # first client pass cannot reproduce: a hydration mismatch that looks
          # identical on screen and silently stops the page hydrating.
          #
          # Asserted as a count rather than a presence, so a screen whose money
          # stopped rendering at all fails here too.
          for path in / /absence /absence/cohorts /absence/outcomes /absence/operations \
                      /sick-leave /sick-leave/ops; do
            curl -s -b /tmp/jar -o /tmp/page.html "http://127.0.0.1:3000$path"
            n=$(grep -oE '>R[0-9]|>R-[0-9]' /tmp/page.html | wc -l)
            echo "$path server-rendered Rand figures: $n"
            [ "$n" -ge 1 ] || { echo "::error::$path server-rendered no Rand figure"; fail=1; }
          done

          # A module a tenant does not run must not be reachable, and must say
          # so with a status code rather than serving a 404 page under a 200.
          # The control centre is off by default, so it is the case to check.
          code=$(curl -s -b /tmp/jar -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/control-centre)
          echo "/control-centre (module disabled) -> $code"
          [ "$code" = "404" ] || { echo "::error::a disabled module returned $code, expected 404"; fail=1; }

          # The gate lives in the module layout, so every screen in the module
          # is gated, including ones added later. Checked here, against the
          # same still-running server, rather than after it is stopped.
          for path in /control-centre/alerts /control-centre/playbooks /control-centre/briefing; do
            code=$(curl -s -b /tmp/jar -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000$path")
            echo "$path (module disabled) -> $code"
            [ "$code" = "404" ] || { echo "::error::a disabled module screen returned $code at $path, expected 404"; fail=1; }
          done

          # No screen may leak an employee identifier. The module data is built
          # from aggregates only, so an identifier appearing in rendered output
          # means a per-person section reached a cohort screen.
          #
          # This runs here, against the still-running server on 3000. It used to
          # sit after the kill below, where it queried a dead port: curl
          # returned nothing, grep found nothing in nothing, and the check
          # passed on an empty response. A leak check that cannot fail is worse
          # than no leak check, because it reads as coverage.
          for path in /absence /absence/cohorts /absence/outcomes /absence/operations; do
            body=$(curl -s -b /tmp/jar "http://127.0.0.1:3000$path")
            if [ -z "$body" ]; then
              echo "::error::$path returned an empty body, so the leak check measured nothing"
              fail=1
            fi
            if printf '%s' "$body" | grep -qE 'employee_id|EMP[0-9]{3,}'; then
              echo "::error::$path rendered what looks like an employee identifier"
              fail=1
            fi
          done

          # And the other direction: gating that never lets anything through is
          # not gating, it is a broken route. Start a second server with the
          # module on and check it renders.
          # Stopped by pid, and its child with it. The standalone server spawns
          # one, so `kill %1` returned while the child still held the port.
          # Different ports mean the two servers do not collide either way, but
          # leaving a half-killed process behind made failures here hard to read.
          pkill -P "$SRV_DISABLED" 2>/dev/null || true
          kill "$SRV_DISABLED" 2>/dev/null || true

          WELO_MODULE_CONTROL_CENTRE=1 PORT=3001 node .next/standalone/server.js &
          SRV_ENABLED=$!
          wait_up 3001 || exit 1
          curl -s -c /tmp/jar2 -X POST -H 'content-type: application/json' \
            -d '{"email":"sipho.dlamini@example.com"}' http://127.0.0.1:3001/api/session > /dev/null
          for path in /control-centre /control-centre/playbooks /control-centre/alerts /control-centre/briefing; do
            code=$(curl -s -b /tmp/jar2 -o /tmp/cc.html -w '%{http_code}' "http://127.0.0.1:3001$path")
            echo "$path (module enabled) -> $code"
            [ "$code" = "200" ] || { echo "::error::an enabled module returned $code at $path, expected 200"; fail=1; }

            # The control centre's own rule: age is reportable and never
            # targetable, on an intervention or an alert rule. If a screen ever
            # offers it, that is a finding.
            if grep -q 'value="cohort_age"' /tmp/cc.html; then
              echo "::error::$path offered a protected attribute as a targeting dimension"
              fail=1
            fi
          done



          # Role based access control, asserted end to end. The permission model
          # has unit tests; this checks the routes actually enforce it, because
          # a hidden menu item is not a control and the solution design says so.
          #
          # account:route:expected, as one field so the loop needs no heredoc
          # (a heredoc terminator has to sit at column zero, which would end
          # this YAML block scalar).
          for case in \
            "thandi.mokoena@example.com:/absence:200" \
            "thandi.mokoena@example.com:/sick-leave/case:403" \
            "thandi.mokoena@example.com:/admin:403" \
            "thandi.mokoena@example.com:/control-centre:403" \
            "sipho.dlamini@example.com:/sick-leave/case:200" \
            "sipho.dlamini@example.com:/admin:403" \
            "johan.vandermerwe@example.com:/admin:200" \
            "johan.vandermerwe@example.com:/absence:403" \
            "johan.vandermerwe@example.com:/sick-leave/case:403" \
            "naledi.khumalo@example.com:/control-centre:200" \
            "naledi.khumalo@example.com:/sick-leave/case:403" \
            "support@example.com:/:403" \
            "support@example.com:/absence:403" \
            "support@example.com:/admin:403" \
            "prospect@example.com:/sick-leave/case:403" \
            "naledi.khumalo@example.com:/control-centre/playbooks:200" \
            "sipho.dlamini@example.com:/control-centre/playbooks:200" \
            "thandi.mokoena@example.com:/control-centre/playbooks:403" \
            "johan.vandermerwe@example.com:/control-centre/playbooks:403" \
            "support@example.com:/control-centre/playbooks:403" \
            "naledi.khumalo@example.com:/control-centre/briefing:200" \
            "thandi.mokoena@example.com:/control-centre/briefing:403" \
          ; do
            email="${case%%:*}"; rest="${case#*:}"; route="${rest%%:*}"; want="${rest##*:}"
            curl -s -c /tmp/jar3 -X POST -H 'content-type: application/json' \
              -d "{\"email\":\"$email\"}" http://127.0.0.1:3001/api/session > /dev/null
            got=$(curl -s -b /tmp/jar3 -o /dev/null -w '%{http_code}' "http://127.0.0.1:3001$route")
            printf '  %-32s %-22s want %s got %s\n' "$email" "$route" "$want" "$got"
            [ "$got" = "$want" ] || { echo "::error::$email got $got at $route, expected $want"; fail=1; }
          done

          # And the agent API refuses a role that may not use it, which is the
          # check the solution design puts in the API rather than the menu.
          curl -s -c /tmp/jar4 -X POST -H 'content-type: application/json' \
            -d '{"email":"thandi.mokoena@example.com"}' http://127.0.0.1:3001/api/session > /dev/null
          code=$(curl -s -b /tmp/jar4 -o /dev/null -w '%{http_code}' -X POST \
            -H 'content-type: application/json' -d '{"question":"hi","data":{}}' \
            http://127.0.0.1:3001/api/absenteeism/agents/analyst/stream)
          echo "agent API as viewer -> $code"
          [ "$code" = "403" ] || { echo "::error::the agent API allowed a role without use.agents ($code)"; fail=1; }

          # Creating is a different permission from reading the register, and
          # from approving. This is the check that would have caught
          # control.create being held by nobody while the create form was
          # gated on control.view: the Approver could do both.
          #
          # account:endpoint:expected. Drafting returns 200 with no agent key
          # configured: the plan is assembled from a template and labelled as
          # one, so the approval flow is demonstrable without a secret. It used
          # to 503, which made the screen's whole point unreachable in CI and in
          # any deployment without a key.
          CC_TARGET='{"dimension":"cohort_fatigue","cohort":"Critical"}'
          CC_TARGET_LOAD='{"dimension":"cohort_load","cohort":"Standard ops"}'
          for case in \
            "sipho.dlamini@example.com:interventions:200" \
            "prospect@example.com:interventions:200" \
            "naledi.khumalo@example.com:interventions:403" \
            "thandi.mokoena@example.com:interventions:403" \
            "support@example.com:interventions:403" \
            "sipho.dlamini@example.com:draft:200" \
            "naledi.khumalo@example.com:draft:403" \
            "thandi.mokoena@example.com:draft:403" \
          ; do
            email="${case%%:*}"; rest="${case#*:}"; what="${rest%%:*}"; want="${rest##*:}"
            curl -s -c /tmp/jar5 -X POST -H 'content-type: application/json' \
              -d "{\"email\":\"$email\"}" http://127.0.0.1:3001/api/session > /dev/null
            if [ "$what" = "interventions" ]; then
              url=http://127.0.0.1:3001/api/control-centre/interventions
              payload="{\"record\":{\"title\":\"Smoke\",\"target\":[$CC_TARGET]}}"
            else
              url=http://127.0.0.1:3001/api/control-centre/playbooks/draft
              payload="{\"intervention\":{\"id\":\"icv-002\",\"title\":\"Smoke\",\"target\":[$CC_TARGET]}}"
            fi
            got=$(curl -s -b /tmp/jar5 -o /dev/null -w '%{http_code}' -X POST \
              -H 'content-type: application/json' -d "$payload" "$url")
            printf '  %-32s %-16s want %s got %s\n' "$email" "$what" "$want" "$got"
            [ "$got" = "$want" ] || { echo "::error::$email got $got on $what, expected $want"; fail=1; }
          done

          # And the write API refuses a record carrying a person, rather than
          # cleaning it and reporting success. The store strips; the API refuses.
          curl -s -c /tmp/jar6 -X POST -H 'content-type: application/json' \
            -d '{"email":"sipho.dlamini@example.com"}' http://127.0.0.1:3001/api/session > /dev/null
          code=$(curl -s -b /tmp/jar6 -o /dev/null -w '%{http_code}' -X POST \
            -H 'content-type: application/json' \
            -d "{\"record\":{\"title\":\"Smoke\",\"employee_id\":105525,\"target\":[$CC_TARGET]}}" \
            http://127.0.0.1:3001/api/control-centre/interventions)
          # A template draft must never pass as a model draft. Checked over the
          # wire rather than in the unit test alone, because the label has to
          # survive the route, not just the module.
          #
          # Its own session: /tmp/jar5 is left holding whichever account the
          # matrix above finished on, which is a refused role, so reusing it
          # drafted as the viewer and asserted against a 403 body.
          curl -s -c /tmp/jar-draft -X POST -H 'content-type: application/json' \
            -d '{"email":"sipho.dlamini@example.com"}' http://127.0.0.1:3001/api/session > /dev/null
          body=$(curl -s -b /tmp/jar-draft -X POST -H 'content-type: application/json' \
            -d "{\"intervention\":{\"id\":\"icv-004\",\"title\":\"Smoke\",\"created\":\"2026-04-02\",\"target\":[{\"dimension\":\"cohort_load\",\"cohort\":\"Standard ops\"}]}}" \
            http://127.0.0.1:3001/api/control-centre/playbooks/draft)
          echo "$body" | grep -q '"drafted_with":"template"' || {
            echo "::error::a draft produced without an agent key was not labelled as a template"
            fail=1
          }
          echo "$body" | grep -q '"source":"template"' || {
            echo "::error::the drafting response did not declare its source"
            fail=1
          }
          echo "$body" | grep -q '"ok":true' || {
            echo "::error::the template draft did not pass the playbook rules it is held to"
            fail=1
          }
          echo "template draft labelled and validated"

          # The sick-leave agent panels answer their suggested questions without a
          # key, from the figures on screen, and say so. Three of the four agent
          # surfaces in the demo were dark before this; the label is what stops
          # a summary passing as a model, so it is checked over the wire.
          slbody=$(curl -s -b /tmp/jar-draft -X POST -H 'content-type: application/json' \
            -d '{"agent":"analyst","question":"Where is sick leave cost concentrating and why","context":{"headline":{"sickLeaveRatePct":3.2,"indicativeCostRand":1,"coverCostRand":1}}}' \
            http://127.0.0.1:3001/api/sick-leave/agent)
          echo "$slbody" | grep -q '"source":"summary"' || {
            echo "::error::the sick-leave agent did not answer from the figures without a key"
            fail=1
          }
          echo "$slbody" | grep -q 'not by a language model' || {
            echo "::error::a summarised answer was not labelled as not coming from a model"
            fail=1
          }
          # And a question outside the suggested set is declined rather than
          # answered with a paragraph that reads like an answer.
          slrefuse=$(curl -s -b /tmp/jar-draft -X POST -H 'content-type: application/json' \
            -d '{"agent":"analyst","question":"Who should we performance manage","context":{}}' \
            http://127.0.0.1:3001/api/sick-leave/agent)
          echo "$slrefuse" | grep -q '"answered":false' || {
            echo "::error::an unsupported question was answered instead of declined"
            fail=1
          }
          echo "sick-leave agent summarises and declines correctly"

          # The strategic one. The template path exists so the demo works
          # without a secret; it must never run when a key is configured, or a
          # buyer would be shown arithmetic and told it was the model.
          #
          # A deliberately invalid key proves the branch without needing a
          # valid one: the route must attempt the model and report a rejected
          # key, naming the model it tried. A summary coming back here would
          # mean the fallback had quietly become the product.
          # On its own port, alongside the others rather than replacing one.
          # Stopping the 3001 server here left every later check in this step
          # talking to a dead port, which failed as a connection error with no
          # assertion to explain it.
          ANTHROPIC_API_KEY=sk-ant-ci-deliberately-invalid WELO_MODULE_CONTROL_CENTRE=1 \
            PORT=3002 node .next/standalone/server.js &
          SRV_KEYED=$!
          wait_up 3002 || exit 1
          curl -s -c /tmp/jar-keyed -X POST -H 'content-type: application/json' \
            -d '{"email":"sipho.dlamini@example.com"}' http://127.0.0.1:3002/api/session > /dev/null

          keyed=$(curl -s -m 60 -b /tmp/jar-keyed -X POST -H 'content-type: application/json' \
            -d '{"agent":"analyst","question":"Where is sick leave cost concentrating and why","context":{"headline":{}}}' \
            http://127.0.0.1:3002/api/sick-leave/agent)
          echo "$keyed" | grep -q '"source":"summary"' && {
            echo "::error::a key is configured and the agent still answered from the template. The fallback has become the product."
            fail=1
          }
          echo "$keyed" | grep -q 'claude-' || {
            echo "::error::the agent did not report which model it tried"
            fail=1
          }
          echo "$keyed" | grep -qi 'sk-ant' && {
            echo "::error::the agent response echoed something key-shaped"
            fail=1
          }
          echo "with a key configured, the agent calls the model: $(echo "$keyed" | head -c 100)"

          # And the drafter, which is the most consequential call, explains the
          # failure rather than reporting that it failed.
          drafted=$(curl -s -m 60 -b /tmp/jar-keyed -X POST -H 'content-type: application/json' \
            -d "{\"intervention\":{\"id\":\"icv-004\",\"title\":\"Smoke\",\"created\":\"2026-04-02\",\"target\":[$CC_TARGET_LOAD]}}" \
            http://127.0.0.1:3002/api/control-centre/playbooks/draft)
          echo "$drafted" | grep -q '"drafted_with":"template"' && {
            echo "::error::a key is configured and the drafter still produced a template"
            fail=1
          }
          echo "$drafted" | grep -q 'key was rejected' || {
            echo "::error::the drafter did not explain the failure; it said: $(echo "$drafted" | head -c 120)"
            fail=1
          }
          echo "with a key configured, the drafter calls the model and explains a failure"

          pkill -P "$SRV_KEYED" 2>/dev/null || true
          kill "$SRV_KEYED" 2>/dev/null || true

          echo "intervention carrying an employee key -> $code"
          [ "$code" = "422" ] || { echo "::error::a record carrying an employee key was not refused ($code)"; fail=1; }

          # A protected attribute cannot be targeted, over the API and not only
          # in the form.
          code=$(curl -s -b /tmp/jar6 -o /dev/null -w '%{http_code}' -X POST \
            -H 'content-type: application/json' \
            -d '{"record":{"title":"Smoke","target":[{"dimension":"cohort_age","cohort":"50+"}]}}' \
            http://127.0.0.1:3001/api/control-centre/interventions)
          echo "intervention targeting an age band -> $code"
          [ "$code" = "422" ] || { echo "::error::targeting a protected attribute was not refused ($code)"; fail=1; }

          # Outbound tasks. Two assertions that matter more than the rest:
          # nothing leaves without an approval, and the approver cannot send.
          # The second is the separation the role exists for, and it is the
          # kind of thing a convenience change would quietly undo.
          APPROVED='{"id":"pb-001","intervention_id":"icv-001","title":"P","status":"Approved","drafted_by":"sipho.dlamini@example.com","steps":[{"action":"Cap consecutive shifts across the cohort.","owner":"Shift scheduling","horizon":"immediate","measure":"absent_days_per_head_annual"}],"approval":{"by":"naledi.khumalo@example.com","by_role":"approver","at":"2026-08-18","decision":"approved"}}'
          STEP='{"action":"Cap consecutive shifts across the cohort.","owner":"Shift scheduling","horizon":"immediate","measure":"absent_days_per_head_annual"}'
          ICV='{"id":"icv-001","title":"Rostering review","target":[{"dimension":"cohort_load","cohort":"High-intensity ops"}]}'

          taskcode=$(curl -s -b /tmp/jar-draft -o /tmp/task.json -w '%{http_code}' -X POST \
            -H 'content-type: application/json' \
            -d "{\"playbook\":$APPROVED,\"step\":$STEP,\"intervention\":$ICV}" \
            http://127.0.0.1:3001/api/control-centre/tasks)
          echo "task from an approved playbook -> $taskcode"
          [ "$taskcode" = "200" ] || { echo "::error::an approved step could not be released ($taskcode)"; fail=1; }
          grep -q '"sent":false' /tmp/task.json || { echo "::error::the task response did not say it was not sent"; fail=1; }
          grep -q '"transport":"mock"' /tmp/task.json || { echo "::error::the task did not record its transport as mocked"; fail=1; }

          # Drafted rather than approved: nothing leaves.
          DRAFTED=$(printf '%s' "$APPROVED" | sed 's/"status":"Approved"/"status":"Drafted"/; s/,"approval":{[^}]*}//')
          taskcode=$(curl -s -b /tmp/jar-draft -o /dev/null -w '%{http_code}' -X POST \
            -H 'content-type: application/json' \
            -d "{\"playbook\":$DRAFTED,\"step\":$STEP,\"intervention\":$ICV}" \
            http://127.0.0.1:3001/api/control-centre/tasks)
          echo "task from an unapproved playbook -> $taskcode"
          [ "$taskcode" = "422" ] || { echo "::error::a task left the platform without an approval ($taskcode)"; fail=1; }

          # The approver permits a task and does not send one.
          curl -s -c /tmp/jar-appr -X POST -H 'content-type: application/json' \
            -d '{"email":"naledi.khumalo@example.com"}' http://127.0.0.1:3001/api/session > /dev/null
          taskcode=$(curl -s -b /tmp/jar-appr -o /dev/null -w '%{http_code}' -X POST \
            -H 'content-type: application/json' \
            -d "{\"playbook\":$APPROVED,\"step\":$STEP,\"intervention\":$ICV}" \
            http://127.0.0.1:3001/api/control-centre/tasks)
          echo "task sent by the approver -> $taskcode"
          [ "$taskcode" = "403" ] || { echo "::error::the approver was able to send a task ($taskcode), which collapses the separation the role exists for"; fail=1; }


          pkill -P "$SRV_ENABLED" 2>/dev/null || true
          kill "$SRV_ENABLED" 2>/dev/null || true

          exit $fail

  # --- Infrastructure --------------------------------------------------------
  terraform:
    name: Terraform validate, test, scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Format
        working-directory: infra/terraform
        run: terraform fmt -recursive -check -diff

      # -backend=false: validating and testing needs no state and no GCP
      # credentials, which is what lets this run on a pull request from a fork.
      - name: Init and validate
        working-directory: infra/terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Init and validate (bootstrap)
        working-directory: infra/terraform/bootstrap
        run: |
          terraform init -backend=false -input=false
          terraform validate

      # The controls in infra/terraform/tests assert what README and
      # docs/devsecops.md claim: buckets that cannot be made public, a
      # small-cell floor that cannot be lowered, tenant data a destroy cannot
      # take, and an application identity that cannot reach the raw upload.
      # These run with a placeholder token and reach no API.
      #
      # The floor matters as much as the result. `terraform test` fails when an
      # assertion fails, but a run that is deleted rather than argued about
      # passes silently, which is the exact failure mode these tests exist to
      # catch. So the count is asserted too.
      - name: Control tests
        working-directory: infra/terraform
        run: |
          terraform test | tee tf-test.out
          runs=$(grep -c 'run "' tests/*.tftest.hcl | awk -F: '{s+=$2} END {print s}')
          echo "control tests declared: $runs"
          [ "$runs" -ge 33 ] || {
            echo "::error::$runs control test runs declared, expected at least 33. A control test was removed; say why in the diff and lower the floor deliberately."
            exit 1
          }

      # The lock file pins the provider for everyone, but only for the platforms
      # it records hashes for. An operator on a Mac hitting a lock built only on
      # Linux gets a hash failure, and the tempting fix is to delete the lock.
      # Four platforms are recorded; this checks they are still there.
      #   terraform providers lock -platform=linux_amd64 -platform=darwin_arm64 \
      #     -platform=darwin_amd64 -platform=windows_amd64
      - name: Provider lock covers every platform we operate from
        working-directory: infra/terraform
        run: |
          test -f .terraform.lock.hcl || { echo "::error::no provider lock file"; exit 1; }
          count=$(grep -c '"h1:' .terraform.lock.hcl || true)
          echo "lock records $count platform hashes"
          [ "$count" -ge 4 ] || {
            echo "::error::provider lock covers $count platforms, expected at least 4. Re-run terraform providers lock with every -platform flag."
            exit 1
          }

  iac-scan:
    name: Infrastructure security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Checkov over the Terraform, the Dockerfiles and this workflow itself.
      # Findings block: this configuration provisions the project that will hold
      # employee health data, so a misconfiguration is not something to merge
      # and revisit.
      #
      # There is deliberately no skip_check list here. Every exemption lives as
      # a `checkov:skip=ID: reason` comment on the exact resource it applies to,
      # so a reviewer sees the justification next to the thing being exempted
      # and an exemption cannot silently widen to resources it was never
      # considered for. There are nine, all in infra/terraform.
      - name: Checkov
        uses: bridgecrewio/checkov-action@16c078443ac4b4b1f694817dff28944de3d2a1ca # v12.3025.0
        with:
          directory: .
          framework: terraform,dockerfile,github_actions
          skip_path: node_modules,.next,public
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
          soft_fail: false

      - name: Upload Checkov findings
        if: always()
        uses: github/codeql-action/upload-sarif@9e8d0789d4a0fa9ceb6b1738f7e269594bdd67f0 # v3.28.9
        with:
          sarif_file: checkov.sarif
          category: checkov

  # --- Containers ------------------------------------------------------------
  containers:
    name: Container build, scan, SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: welo-inference
            context: model
          - name: welo-platform
            context: .
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build
        run: docker build -t ${{ matrix.name }}:ci ${{ matrix.context }}

      # Both images must run as a non-root user. Asserted rather than assumed:
      # a Dockerfile edit that drops the USER line fails here.
      - name: Image does not run as root
        run: |
          uid=$(docker run --rm --entrypoint sh ${{ matrix.name }}:ci -c 'id -u' 2>/dev/null \
                || docker run --rm ${{ matrix.name }}:ci id -u)
          echo "${{ matrix.name }} runs as uid $uid"
          [ "$uid" != "0" ] || { echo "::error::${{ matrix.name }} runs as root"; exit 1; }

      # Two passes, because "block on any critical finding" and "do not stop all
      # work" are both right and they conflict.
      #
      # This one reports everything at CRITICAL and HIGH into the security tab,
      # where it has an owner. It does not block: a base-image CVE with no fix
      # available would otherwise halt every branch until upstream moves, and a
      # gate that halts everything gets switched off, which is worth nothing.
      - name: Vulnerability scan, reported (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.name }}:ci
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload vulnerability findings
        if: always()
        uses: github/codeql-action/upload-sarif@9e8d0789d4a0fa9ceb6b1738f7e269594bdd67f0 # v3.28.9
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-${{ matrix.name }}

      # This one blocks, on exactly what can be acted on: a CRITICAL finding
      # that has a fix available. That is the reconciliation of the guardrail
      # the solution design states ("blocks promotion of any image with a
      # critical finding") with the reason it was not blocking. An unfixable
      # critical still fails nothing and still appears above; a fixable one
      # stops the build, because the remedy is a version bump.
      #
      # Runs after the upload so a blocked build still publishes its findings.
      - name: Vulnerability gate, fixable criticals block (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.name }}:ci
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # An SBOM is what makes "is this image affected by the next advisory"
      # answerable without rebuilding and guessing.
      - name: SBOM
        uses: anchore/sbom-action@f325610c9f50a54015d37c8d16cb3b0e2c8f4de0 # v0.18.0
        with:
          image: ${{ matrix.name }}:ci
          format: spdx-json
          artifact-name: sbom-${{ matrix.name }}.spdx.json

  # --- Agent behaviour -------------------------------------------------------
  # The evals are the only check that the guardrails hold in the agents'
  # actual output, so they are a gate, not a report. They run live only where a
  # key is available; on a fork they skip rather than fail.
  agent-evals:
    name: Agent evals
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install service (with dev extras)
        run: pip install -e "./model[dev]"

      - name: Agent evals (live, only if a key secret is configured)
        working-directory: model
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "No ANTHROPIC_API_KEY secret set; skipping live agent evals."
            exit 0
          fi
          python -m welo_inference.evals --out reports/agent_eval.json

      - name: Upload agent eval report
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: agent-eval-report
          path: model/reports/agent_eval.json
          if-no-files-found: ignore

  # The single check to require for a merge, so adding a job above does not mean
  # editing branch protection.
  ci:
    name: CI
    if: always()
    needs: [secret-scan, python, web, terraform, iac-scan, containers, agent-evals]
    runs-on: ubuntu-latest
    steps:
      - name: Every required job succeeded
        run: |
          # Single quotes. A GitHub expression has no double-quoted string, so
          # join(needs.*.result, " ") is a parse error, and a workflow that
          # does not parse produces a run with no jobs at all. Every push since
          # this gate was added was reported as a failed CI run that had in
          # fact never started: red for the right reason by accident, and
          # nothing underneath it ever ran.
          results='${{ join(needs.*.result, ' ') }}'
          echo "results: $results"
          for r in $results; do
            [ "$r" = "success" ] || { echo "::error::a required job did not succeed"; exit 1; }
          done
